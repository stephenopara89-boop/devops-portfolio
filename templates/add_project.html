{% extends "base.html" %}

{% block title %}
Add Project | My DevOps Portfolio
{% endblock %}

{% block content %}

<main>

    <h1>Add a New Project</h1>

    <form method="POST">

        <label for="name">Project Name</label>
        <br>

        <input
            type="text"
            id="name"
            name="name"
            required
        >

        <br><br>

        <label for="description">Description</label>
        <br>

        <textarea
            id="description"
            name="description"
            required
        ></textarea>

        <br><br>

        <label for="technologies">Technologies</label>
        <br>

        <input
            type="text"
            id="technologies"
            name="technologies"
            placeholder="Python, Flask, Docker"
            required
        >

        <br><br>

        <label for="github_url">GitHub URL</label>
        <br>

        <input
            type="url"
            id="github_url"
            name="github_url"
        >

        <br><br>

        <label for="live_url">Live Project URL</label>
        <br>

        <input
            type="url"
            id="live_url"
            name="live_url"
        >

        <br><br>

        <button type="submit">
            Add Project
        </button>

    </form>

</main>

{% endblock %}
